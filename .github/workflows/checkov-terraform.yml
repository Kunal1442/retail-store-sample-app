name: Checkov (Terraform)

on:
  push:
    branches: [ main ]          # EDIT: your default branch name
  pull_request:
    branches: [ main ]          # EDIT: your default branch name
  schedule:
    - cron: '0 4 * * 1'

jobs:
  checkov:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write    # needed to upload SARIF to code scanning
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .          # EDIT: e.g. ./infra if Terraform is in a subfolder
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true       # don't fail the job here; the ruleset will gate merges

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: results.sarif
          category: checkov-terraform
